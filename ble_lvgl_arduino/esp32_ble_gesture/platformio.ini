[platformio]
default_envs = esp32-s3-devkitm-1
; Arduino entry file is kept at the project root, while implementation files live in src/
; and public headers are under include/.
src_dir = .
include_dir = include

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio

build_flags =
    -Os
    -Iinclude
    -Isrc
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

build_unflags =
    -O0
    -O2
    -flto

lib_deps =
    lvgl@^8.3.11

lib_ldf_mode = chain+
build_src_filter =
    +<*.ino>
    +<src/*.c>
    +<src/*.cpp>
    +<src/*.h>
    -<build/>
    -<docs/>
    -<assets/>
    -<**/*.md>

; Only compile the actual Arduino entry and implementation sources.